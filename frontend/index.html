<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exam Killer - AI 答题助手</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    :root {
      --primary: #6366f1;
      --primary-dark: #4f46e5;
      --bg: #0f172a;
      --bg-card: #1e293b;
      --bg-input: #334155;
      --text: #f1f5f9;
      --text-dim: #94a3b8;
      --border: #334155;
      --success: #22c55e;
      --warning: #f59e0b;
      --error: #ef4444;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: var(--bg-card);
      border-bottom: 1px solid var(--border);
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 20px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .logo span { color: var(--primary); }

    .usage-badge {
      background: var(--bg-input);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 13px;
      color: var(--text-dim);
    }

    .usage-badge strong { color: var(--text); }

    .main {
      flex: 1;
      max-width: 800px;
      width: 100%;
      margin: 0 auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
    }

    .chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 16px 0;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .message {
      display: flex;
      gap: 12px;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message.user { flex-direction: row-reverse; }

    .avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      flex-shrink: 0;
    }

    .message.user .avatar { background: var(--success); }

    .bubble {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 12px 16px;
      max-width: 70%;
      line-height: 1.6;
      font-size: 15px;
    }

    .message.user .bubble {
      background: var(--primary);
      border-color: var(--primary);
    }

    .bubble pre {
      background: var(--bg-input);
      border-radius: 8px;
      padding: 12px;
      margin-top: 8px;
      overflow-x: auto;
      font-size: 13px;
    }

    .bubble code {
      font-family: 'Fira Code', 'Consolas', monospace;
      background: var(--bg-input);
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 13px;
    }

    .bubble pre code { background: none; padding: 0; }

    .bubble p { margin-bottom: 8px; }
    .bubble p:last-child { margin-bottom: 0; }

    .input-area {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 12px;
      display: flex;
      gap: 8px;
      margin-top: auto;
    }

    textarea {
      flex: 1;
      background: var(--bg-input);
      border: none;
      border-radius: 12px;
      padding: 12px 16px;
      color: var(--text);
      font-size: 15px;
      resize: none;
      outline: none;
      min-height: 48px;
      max-height: 200px;
      font-family: inherit;
    }

    textarea::placeholder { color: var(--text-dim); }

    .send-btn {
      background: var(--primary);
      border: none;
      border-radius: 12px;
      width: 48px;
      height: 48px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
      flex-shrink: 0;
    }

    .send-btn:hover { background: var(--primary-dark); }
    .send-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .send-btn svg { width: 20px; height: 20px; fill: white; }

    .model-select {
      background: var(--bg-input);
      border: none;
      border-radius: 8px;
      padding: 8px 12px;
      color: var(--text);
      font-size: 13px;
      cursor: pointer;
      outline: none;
    }

    .typing {
      display: flex;
      gap: 8px;
      align-items: center;
      color: var(--text-dim);
      font-size: 14px;
    }

    .typing span {
      width: 6px; height: 6px;
      background: var(--text-dim);
      border-radius: 50%;
      animation: bounce 1.4s infinite;
    }
    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
      40% { transform: scale(1); opacity: 1; }
    }

    .welcome {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-dim);
    }

    .welcome h2 { font-size: 24px; color: var(--text); margin-bottom: 12px; }
    .welcome p { font-size: 15px; line-height: 1.8; }
  </style>
</head>
<body>

<header>
  <div class="logo">⚡ <span>Exam</span> Killer</div>
  <div class="usage-badge">
    今日剩余: <strong id="remaining">--</strong> / <span id="limit">20</span> 次
  </div>
</header>

<div class="main">
  <div class="chat-container" id="chat">
    <div class="welcome">
      <h2>🎓 Exam Killer</h2>
      <p>输入你的题目，AI 帮你解答<br>支持数学、物理、化学、编程等各种题型</p>
    </div>
  </div>

  <div class="input-area">
    <select class="model-select" id="model">
      <option value="deepseek-web/deepseek-chat">DeepSeek</option>
      <option value="qwen-web/qwen-plus">Qwen</option>
      <option value="kimi-web/moonshot-v1-8k">Kimi</option>
      <option value="doubao-web/doubao-seed-2.0">豆包</option>
      <option value="glm-web/glm-4-Plus">GLM</option>
    </select>
    <textarea id="input" placeholder="输入你的问题..." rows="1"></textarea>
    <button class="send-btn" id="send" onclick="sendMessage()">
      <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
    </button>
  </div>
</div>

<script>
  const API_BASE = '';  // 同源部署，留空即可
  const chat = document.getElementById('chat');
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('send');
  const remainingEl = document.getElementById('remaining');
  const limitEl = document.getElementById('limit');

  let messages = [];
  let deviceId = localStorage.getItem('ek_did') || (localStorage.setItem('ek_did', Math.random().toString(36).slice(2)), localStorage.getItem('ek_did'));

  // Auto-resize textarea
  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 200) + 'px';
  });

  // Enter to send
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  async function loadUsage() {
    try {
      const res = await fetch(`${API_BASE}/api/usage`, {
        headers: { 'X-Device-ID': deviceId }
      });
      const data = await res.json();
      remainingEl.textContent = Math.max(0, data.limit - data.used);
      limitEl.textContent = data.limit;
    } catch (e) { remainingEl.textContent = '?'; }
  }

  function addMessage(role, content) {
    const div = document.createElement('div');
    div.className = `message ${role}`;
    div.innerHTML = `
      <div class="avatar">${role === 'user' ? '👤' : '🤖'}</div>
      <div class="bubble">${formatContent(content)}</div>
    `;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return div;
  }

  function addTyping() {
    const div = document.createElement('div');
    div.className = 'message';
    div.id = 'typing';
    div.innerHTML = `
      <div class="avatar">🤖</div>
      <div class="bubble">
        <div class="typing">
          <span></span><span></span><span></span>
        </div>
      </div>
    `;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return div;
  }

  function removeTyping() {
    const t = document.getElementById('typing');
    if (t) t.remove();
  }

  function formatContent(text) {
    // Basic markdown-like formatting
    text = text.replace(/```(\w*)\n?([\s\S]*?)```/g, '<pre><code>$2</code></pre>');
    text = text.replace(/`([^`]+)`/g, '<code>$1</code>');
    text = text.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    text = text.replace(/\n/g, '<br>');
    return text;
  }

  async function sendMessage() {
    const text = input.value.trim();
    if (!text || sendBtn.disabled) return;

    sendBtn.disabled = true;
    input.value = '';
    input.style.height = 'auto';

    addMessage('user', text);
    messages.push({ role: 'user', content: text });

    const typingEl = addTyping();

    try {
      const model = document.getElementById('model').value;
      const res = await fetch(`${API_BASE}/api/chat`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'X-Device-ID': deviceId,
        },
        body: JSON.stringify({
          message: text,
          model,
          system: '你是一个专业的 AI 答题助手。请清晰、详细地解答用户的问题，特别是数学、物理、化学等理科题目需要给出完整解题步骤。回答使用中文。'
        })
      });

      removeTyping();

      if (res.status === 429) {
        const data = await res.json();
        addMessage('assistant', `⏰ ${data.message || '今日次数已用完，明天再来吧！'}`);
        return;
      }

      if (!res.ok) {
        const data = await res.json();
        addMessage('assistant', `❌ 出错了: ${data.error || '未知错误'}`);
        return;
      }

      const data = await res.json();
      const reply = data.choices?.[0]?.message?.content || '抱歉，没有收到回复。';
      
      addMessage('assistant', reply);
      messages.push({ role: 'assistant', content: reply });
      
      loadUsage(); // Refresh usage count
    } catch (err) {
      removeTyping();
      addMessage('assistant', `❌ 网络错误: ${err.message}`);
    } finally {
      sendBtn.disabled = false;
    }
  }

  loadUsage();
</script>

</body>
</html>
