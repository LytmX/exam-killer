<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exam Killer - AI 多模型比对 · 支持图片</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --primary: #6366f1;
      --primary-dark: #4f46e5;
      --bg: #0f172a;
      --bg-card: #1e293b;
      --bg-input: #334155;
      --text: #f1f5f9;
      --text-dim: #94a3b8;
      --border: #334155;
      --success: #22c55e;
      --warning: #f59e0b;
      --error: #ef4444;
    }
    body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
    header { background: var(--bg-card); border-bottom: 1px solid var(--border); padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; }
    .logo { font-size: 18px; font-weight: 700; }
    .logo span { color: var(--primary); }
    .usage-badge { background: var(--bg-input); padding: 6px 14px; border-radius: 20px; font-size: 13px; }
    .main { max-width: 900px; margin: 0 auto; padding: 20px; }
    
    .input-area { background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; padding: 16px; margin-bottom: 20px; }
    
    /* 图片预览区 */
    .image-preview-area { margin-bottom: 12px; display: none; }
    .image-preview-area.has-images { display: block; }
    .image-preview-label { font-size: 12px; color: var(--text-dim); margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
    .image-previews { display: flex; flex-wrap: wrap; gap: 8px; }
    .image-thumb { position: relative; width: 80px; height: 80px; border-radius: 8px; overflow: hidden; border: 1px solid var(--border); }
    .image-thumb img { width: 100%; height: 100%; object-fit: cover; }
    .image-thumb .remove-btn {
      position: absolute; top: 2px; right: 2px; width: 20px; height: 20px;
      background: rgba(0,0,0,0.7); border: none; border-radius: 50%;
      color: white; font-size: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center;
    }
    .image-thumb canvas { width: 100%; height: 100%; }
    
    /* 输入区 */
    .input-row { display: flex; gap: 8px; align-items: flex-end; }
    .input-wrapper { flex: 1; position: relative; }
    textarea { 
      width: 100%; background: var(--bg-input); border: 1px solid var(--border); border-radius: 12px; 
      padding: 12px 16px; color: var(--text); font-size: 15px; resize: none; outline: none; 
      min-height: 60px; max-height: 200px; font-family: inherit; 
      transition: border-color 0.2s;
    }
    textarea:focus { border-color: var(--primary); }
    textarea::placeholder { color: var(--text-dim); }
    
    /* 图片+截图按钮 */
    .action-btns { display: flex; gap: 6px; margin-bottom: 8px; }
    .action-btn {
      background: var(--bg-input); border: 1px solid var(--border); border-radius: 8px;
      padding: 6px 12px; font-size: 12px; color: var(--text-dim); cursor: pointer; display: flex; align-items: center; gap: 4px; transition: all 0.15s;
    }
    .action-btn:hover { border-color: var(--primary); color: var(--text); }
    .action-btn:active { transform: scale(0.96); }
    .action-btn svg { width: 14px; height: 14px; }
    
    /* 发送按钮 */
    .send-btn { background: var(--primary); border: none; border-radius: 12px; width: 48px; height: 48px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background 0.2s; flex-shrink: 0; }
    .send-btn:hover { background: var(--primary-dark); }
    .send-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .send-btn svg { width: 20px; height: 20px; fill: white; }
    
    /* 模型选择区 */
    .models-section { margin-top: 12px; }
    .models-label { font-size: 12px; color: var(--text-dim); margin-bottom: 8px; }
    .models-grid { display: flex; flex-wrap: wrap; gap: 8px; }
    .model-chip { background: var(--bg-input); border: 1px solid var(--border); border-radius: 20px; padding: 5px 12px; font-size: 12px; cursor: pointer; transition: all 0.15s; color: var(--text-dim); user-select: none; }
    .model-chip:hover { border-color: var(--primary); color: var(--text); }
    .model-chip.active { background: var(--primary); border-color: var(--primary); color: white; }
    .model-chip.wolfram.active { background: #f59e0b; border-color: #f59e0b; color: black; }
    .model-chip.vision.active { background: #10b981; border-color: #10b981; color: white; }
    
    .quick-select { display: flex; gap: 6px; margin-top: 8px; }
    .quick-btn { background: transparent; border: 1px solid var(--border); border-radius: 8px; padding: 3px 10px; font-size: 11px; cursor: pointer; color: var(--text-dim); transition: all 0.15s; }
    .quick-btn:hover { border-color: var(--primary); color: var(--primary); }
    .quick-btn.active { background: var(--primary); border-color: var(--primary); color: white; }
    
    /* 结果区 */
    .result-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; padding: 16px; margin-bottom: 12px; }
    .result-card.best { border-color: var(--success); }
    .result-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .provider-name { font-weight: 600; font-size: 14px; display: flex; align-items: center; gap: 8px; }
    .provider-tag { background: var(--bg-input); border-radius: 6px; padding: 1px 6px; font-size: 10px; color: var(--text-dim); }
    .provider-tag.vision { background: rgba(16,185,129,0.2); color: #10b981; }
    .best-badge { background: var(--success); color: white; padding: 2px 8px; border-radius: 10px; font-size: 11px; }
    .answer { font-size: 14px; line-height: 1.7; white-space: pre-wrap; max-height: 500px; overflow-y: auto; }
    .answer pre { background: var(--bg-input); border-radius: 8px; padding: 10px; overflow-x: auto; font-size: 13px; margin-top: 8px; }
    .answer code { font-family: 'Fira Code', monospace; background: var(--bg-input); padding: 2px 5px; border-radius: 4px; }
    .answer img { max-width: 100%; border-radius: 8px; margin-top: 8px; }
    
    .comparison-bar { background: var(--bg-card); border: 1px solid var(--success); border-radius: 16px; padding: 16px; margin-bottom: 16px; }
    .comparison-title { font-size: 13px; font-weight: 600; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
    .consensus-badge { background: var(--success); color: white; padding: 2px 8px; border-radius: 10px; font-size: 11px; }
    .diff-badge { background: var(--warning); color: black; padding: 2px 8px; border-radius: 10px; font-size: 11px; }
    .summary-text { font-size: 14px; color: var(--text-dim); margin-top: 4px; }
    
    .typing { display: flex; gap: 8px; align-items: center; color: var(--text-dim); font-size: 14px; margin: 20px 0; }
    .typing span { width: 6px; height: 6px; background: var(--text-dim); border-radius: 50%; animation: bounce 1.4s infinite; }
    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce { 0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; } 40% { transform: scale(1); opacity: 1; } }
    
    .empty { text-align: center; padding: 60px; color: var(--text-dim); }
    .empty h2 { font-size: 20px; margin-bottom: 8px; }
    .error-card { background: var(--bg-card); border: 1px solid var(--error); border-radius: 16px; padding: 16px; margin-bottom: 12px; text-align: center; color: var(--error); }
    
    /* 截图提示 */
    .screenshot-hint { position: fixed; bottom: 20px; right: 20px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 12px 16px; font-size: 13px; color: var(--text-dim); display: none; z-index: 1000; box-shadow: 0 4px 20px rgba(0,0,0,0.3); }
    .screenshot-hint.show { display: block; }
    .screenshot-hint strong { color: var(--text); }
    
    /* 答案折叠 */
    .answer-section { margin-bottom: 8px; }
    .answer-preview {
      background: rgba(99,102,241,0.1); border: 1px solid rgba(99,102,241,0.3);
      border-radius: 10px; padding: 10px 14px; font-size: 15px; font-weight: 600;
      color: var(--primary); margin-bottom: 6px;
    }
    .expand-btn {
      background: var(--bg-input); border: 1px solid var(--border); border-radius: 8px;
      padding: 5px 12px; font-size: 12px; color: var(--text-dim); cursor: pointer;
      display: flex; align-items: center; gap: 4px; transition: all 0.15s;
    }
    .expand-btn:hover { border-color: var(--primary); color: var(--primary); }
    .expand-btn svg { width: 12px; height: 12px; transition: transform 0.2s; }
    .expand-btn.open svg { transform: rotate(180deg); }
    .answer-detail { display: none; margin-top: 8px; font-size: 14px; line-height: 1.7; white-space: pre-wrap; }
    .answer-detail.open { display: block; }
    .answer-detail pre { background: var(--bg-input); border-radius: 8px; padding: 10px; overflow-x: auto; font-size: 13px; margin-top: 8px; }
    .answer-detail code { font-family: 'Fira Code', monospace; background: var(--bg-input); padding: 2px 5px; border-radius: 4px; }
    .katex { font-size: 1.1em; }
    .katex-display { margin: 8px 0; overflow-x: auto; }
  </style>
</head>
<body>
<header>
  <div class="logo">⚡ <span>Exam</span> Killer <small style="font-size:11px;color:var(--text-dim)">v7 · 支持图片</small></div>
  <div class="usage-badge">今日剩余: <strong id="remaining">--</strong> / <span id="limit">50</span> 次</div>
</header>

<div class="main">
  <div class="input-area">
    <!-- 图片预览 -->
    <div class="image-preview-area" id="imagePreviewArea">
      <div class="image-preview-label">
        📎 已添加 <span id="imageCount">0</span> 张图片
        <button onclick="clearAllImages()" style="background:none;border:none;color:var(--text-dim);cursor:pointer;font-size:11px;text-decoration:underline;">清空全部</button>
      </div>
      <div class="image-previews" id="imagePreviews"></div>
    </div>
    
    <!-- 操作按钮 -->
    <div class="action-btns">
      <label class="action-btn" for="imageUpload" style="cursor:pointer;">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg>
        上传图片
      </label>
      <input type="file" id="imageUpload" accept="image/*" multiple style="display:none" onchange="handleFileUpload(event)">
      
      <button class="action-btn" onclick="takeScreenshot()">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 4h-3.17L15 2H9L7.17 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm-8 13c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5z"/></svg>
        截图
      </button>
      
      <button class="action-btn" onclick="pasteFromClipboard()">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 2h-4.18C14.4.84 13.3 0 12 0c-1.3 0-2.4.84-2.82 2H5c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-7 0c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm7 18H5V4h2v3h10V4h2v16z"/></svg>
        粘贴
      </button>
    </div>
    
    <!-- 文字输入 -->
    <div class="input-row">
      <div class="input-wrapper">
        <textarea id="input" placeholder="输入题目，或上传/截图/粘贴图片后自动识别..." rows="2"></textarea>
      </div>
      <button class="send-btn" id="send" onclick="askQuestion()">
        <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
      </button>
    </div>
    
    <!-- 模型选择 -->
    <div class="models-section">
      <div class="models-label">选择 AI 模型（可多选）：</div>
      <div class="models-grid">
        <div class="model-chip wolfram" onclick="toggleModel(this, 'wolfram')">📐 Wolfram Alpha</div>
        <div class="model-chip" onclick="toggleModel(this, 'silicon-deepseek-r1')">🧠 DeepSeek R1</div>
        <div class="model-chip" onclick="toggleModel(this, 'silicon-kimi-thinking')">🌙 Kimi K2 Thinking</div>
        <div class="model-chip" onclick="toggleModel(this, 'silicon-qwen-thinking')">🐻 Qwen3-30B Thinking</div>
        <div class="model-chip vision" onclick="toggleModel(this, 'silicon-qwen-vl-72b')">👁️ Qwen2.5-VL 72B（读图）</div>
      </div>
      <div class="quick-select">
        <button class="quick-btn" onclick="selectAll()">全选</button>
        <button class="quick-btn active" onclick="selectDefault()">推荐</button>
        <button class="quick-btn" onclick="selectVisionOnly()">只看图模型</button>
        <button class="quick-btn" onclick="clearAll()">清空</button>
      </div>
    </div>
  </div>

  <div id="results"></div>
</div>

<!-- 截图提示 -->
<div class="screenshot-hint" id="screenshotHint">
  按 <strong>Ctrl+Shift+S</strong> 或 <strong>Command+Shift+S</strong> 截取屏幕<br>
  <span style="font-size:11px;color:var(--text-dim)">截图完成后自动导入</span>
</div>

<script>
  const API = '';
  let deviceId = localStorage.getItem('ek_did') || (localStorage.setItem('ek_did', Math.random().toString(36).slice(2)), localStorage.getItem('ek_did'));
  let activeModels = new Set(['wolfram', 'silicon-deepseek-r1', 'silicon-kimi-thinking', 'silicon-qwen-thinking']);
  let uploadedImages = []; // [{url: 'data:image/...;base64,...', thumb: '...'}]
  let isLoading = false;

  // ==================== 图片处理 ====================

  function toggleModel(el, model) {
    el.classList.toggle('active');
    if (el.classList.contains('active')) {
      activeModels.add(model);
    } else {
      activeModels.delete(model);
    }
  }

  function selectAll() {
    document.querySelectorAll('.model-chip').forEach(c => c.classList.add('active'));
    activeModels = new Set(['wolfram','silicon-deepseek-r1','silicon-kimi-thinking','silicon-qwen-thinking','silicon-qwen-vl-72b']);
    document.querySelectorAll('.quick-btn').forEach(b => b.classList.remove('active'));
  }

  function selectDefault() {
    document.querySelectorAll('.model-chip').forEach(c => c.classList.remove('active'));
    activeModels = new Set(['wolfram', 'silicon-deepseek-r1', 'silicon-kimi-thinking', 'silicon-qwen-thinking']);
    activeModels.forEach(m => {
      const el = document.querySelector(`.model-chip[onclick*="'${m}'"]`);
      if (el) el.classList.add('active');
    });
    document.querySelectorAll('.quick-btn').forEach(b => b.classList.remove('active'));
    event.target.classList.add('active');
  }

  function selectVisionOnly() {
    document.querySelectorAll('.model-chip').forEach(c => c.classList.remove('active'));
    activeModels = new Set(['silicon-qwen-vl-72b']);
    activeModels.forEach(m => {
      const el = document.querySelector(`.model-chip[onclick*="'${m}'"]`);
      if (el) el.classList.add('active');
    });
    document.querySelectorAll('.quick-btn').forEach(b => b.classList.remove('active'));
    event.target.classList.add('active');
  }

  function clearAll() {
    document.querySelectorAll('.model-chip').forEach(c => c.classList.remove('active'));
    activeModels.clear();
    document.querySelectorAll('.quick-btn').forEach(b => b.classList.remove('active'));
  }

  // 上传文件
  function handleFileUpload(event) {
    const files = Array.from(event.target.files);
    files.forEach(file => {
      if (!file.type.startsWith('image/')) return;
      const reader = new FileReader();
      reader.onload = e => {
        const base64 = e.target.result;
        addImage(base64);
      };
      reader.readAsDataURL(file);
    });
    event.target.value = '';
  }

  // 截图（html2canvas 方式：通过页面截图）
  async function takeScreenshot() {
    // 用 browser API 截图
    if (typeof browser !== 'undefined' && browser.takeScreenshot) {
      try {
        const result = await browser.takeScreenshot();
        if (result) {
          addImage(result);
          return;
        }
      } catch(e) {}
    }
    // 降级：用 canvas 截取当前页面可视区域
    try {
      const canvas = document.createElement('canvas');
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      const ctx = canvas.getContext('2d');
      // 由于 canvas 无法跨域截图，改为提示用户
      showHint('截图功能：按 Ctrl+Shift+S / Command+Shift+S 全屏截图，然后粘贴');
    } catch(e) {
      showHint('请使用 Ctrl+Shift+S (Mac: Command+Shift+S) 全屏截图');
    }
  }

  // 从剪贴板粘贴图片
  async function pasteFromClipboard() {
    try {
      const items = await navigator.clipboard.read();
      for (const item of items) {
        for (const type of item.types) {
          if (type.startsWith('image/')) {
            const blob = await item.getType(type);
            const reader = new FileReader();
            reader.onload = e => addImage(e.target.result);
            reader.readAsDataURL(blob);
            return;
          }
        }
      }
      showHint('剪贴板中没有找到图片');
    } catch(e) {
      // 降级：尝试图片 URL
      showHint('粘贴失败，请直接 Ctrl+V 粘贴图片或截图');
    }
  }

  // 添加图片到列表
  function addImage(base64Url) {
    uploadedImages.push({ url: base64Url });
    renderImagePreviews();
  }

  // 移除图片
  function removeImage(index) {
    uploadedImages.splice(index, 1);
    renderImagePreviews();
  }

  // 清空全部图片
  function clearAllImages() {
    uploadedImages = [];
    renderImagePreviews();
  }

  function renderImagePreviews() {
    const area = document.getElementById('imagePreviewArea');
    const container = document.getElementById('imagePreviews');
    const count = document.getElementById('imageCount');
    
    if (uploadedImages.length === 0) {
      area.classList.remove('has-images');
      return;
    }
    
    area.classList.add('has-images');
    count.textContent = uploadedImages.length;
    container.innerHTML = '';
    
    uploadedImages.forEach((img, i) => {
      const thumb = document.createElement('div');
      thumb.className = 'image-thumb';
      thumb.innerHTML = `
        <img src="${img.url}" alt="图片${i+1}">
        <button class="remove-btn" onclick="removeImage(${i})">×</button>
      `;
      container.appendChild(thumb);
    });
  }

  function showHint(msg) {
    const h = document.getElementById('screenshotHint');
    h.textContent = msg;
    h.classList.add('show');
    setTimeout(() => h.classList.remove('show'), 4000);
  }

  // 键盘 Ctrl+V 粘贴图片
  document.addEventListener('paste', async e => {
    const items = e.clipboardData?.items;
    if (!items) return;
    for (const item of items) {
      if (item.type.startsWith('image/')) {
        e.preventDefault();
        const blob = item.getAsFile();
        const reader = new FileReader();
        reader.onload = ev => addImage(ev.target.result);
        reader.readAsDataURL(blob);
        return;
      }
    }
  });

  // ==================== API ====================

  async function loadUsage() {
    try {
      const res = await fetch(`${API}/api/usage`, { headers: { 'X-Device-ID': deviceId } });
      const data = await res.json();
      document.getElementById('remaining').textContent = Math.max(0, data.limit - data.used);
      document.getElementById('limit').textContent = data.limit;
    } catch(e) {}
  }

  function extractKeyAnswer(text) {
    if (!text) return '';
    // 优先找 boxed 答案
    const boxed = text.match(/\\?\\?boxed\{([^}]+)\}/);
    if (boxed) return boxed[1].trim();
    // 找 "最终答案" 后面的内容
    const finalAns = text.match(/最终答案[：:]\s*[\$\\]*([^\$\n]+)/i);
    if (finalAns) return finalAns[1].replace(/[\$\\]/g, '').trim();
    // 找 "答案是" 后面的数字/表达式
    const ans = text.match(/答案[是为]?\s*[\$\\]*([^\$\n]+)/i);
    if (ans) return ans[1].replace(/[\$\\]/g, '').trim();
    // 提取最后的等式/结果
    const lastLine = text.split('\n').filter(l => l.trim() && !l.includes('**步骤') && !l.includes('---')).pop() || '';
    return lastLine.replace(/[#*\[\]]/g, '').replace(/\$\$/g, '').trim() || text.slice(0, 60);
  }

  function renderLatex(text) {
    if (!text) return '';
    // 处理 $$...$$ display math
    text = text.replace(/\$\$([\s\S]+?)\$\$/g, (m, math) => {
      try { return katex.renderToString(math.trim(), { displayMode: true, throwOnError: false }); } catch(e) { return m; }
    });
    // 处理 $...$ inline math
    text = text.replace(/\$([^$\n]+?)\$/g, (m, math) => {
      try { return katex.renderToString(math.trim(), { displayMode: false, throwOnError: false }); } catch(e) { return m; }
    });
    // code blocks
    text = text.replace(/```(\w*)\n?([\s\S]*?)```/g, '<pre><code>$2</code></pre>');
    text = text.replace(/`([^`]+)`/g, '<code>$1</code>');
    text = text.replace(/\n/g, '<br>');
    return text;
  }

  function addResult(provider, answer, isBest, isVision) {
    const results = document.getElementById('results');
    const card = document.createElement('div');
    card.className = 'result-card' + (isBest ? ' best' : '');
    const keyAns = extractKeyAnswer(answer);
    const id = 'ans-' + Math.random().toString(36).slice(2);
    card.innerHTML = `
      <div class="result-header">
        <span class="provider-name">
          ${provider}
          ${isVision ? '<span class="provider-tag vision">👁️ 视觉</span>' : ''}
          ${isBest ? '<span class="best-badge">✅ 推荐</span>' : ''}
        </span>
      </div>
      <div class="answer-preview" id="${id}-preview">📐 ${renderLatex(keyAns)}</div>
      <button class="expand-btn" id="${id}-btn" onclick="toggleDetail('${id}')">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 10l5 5 5-5z"/></svg>
        详细解答
      </button>
      <div class="answer-detail" id="${id}-detail">${renderLatex(answer)}</div>
    `;
    results.appendChild(card);
  }

  function toggleDetail(id) {
    const detail = document.getElementById(id + '-detail');
    const btn = document.getElementById(id + '-btn');
    if (!detail) return;
    const isOpen = detail.classList.contains('open');
    detail.classList.toggle('open');
    btn.classList.toggle('open');
    btn.innerHTML = isOpen
      ? '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 10l5 5 5-5z"/></svg>详细解答'
      : '<svg viewBox="0 0 24 24" fill="currentColor" style="transform:rotate(180deg)"><path d="M7 10l5 5 5-5z"/></svg>收起';
  }

  function addComparison(summary, isConsensus) {
    const results = document.getElementById('results');
    const bar = document.createElement('div');
    bar.className = 'comparison-bar';
    bar.innerHTML = `
      <div class="comparison-title">
        📊 比对结果
        ${isConsensus ? '<span class="consensus-badge">✓ 多模型共识</span>' : '<span class="diff-badge">⚠ 答案有差异</span>'}
      </div>
      <div class="summary-text">${summary}</div>
    `;
    results.insertBefore(bar, results.firstChild);
  }

  async function askQuestion() {
    const input = document.getElementById('input');
    const question = input.value.trim();
    if (!question && uploadedImages.length === 0) return;
    if (isLoading || activeModels.size === 0) return;
    
    isLoading = true;
    document.getElementById('send').disabled = true;
    document.getElementById('results').innerHTML = `
      <div class="typing">
        <span></span><span></span><span></span>
        ${uploadedImages.length > 0 ? `正在用 ${uploadedImages.length} 张图片 + ${activeModels.size} 个 AI 分析...` : `正在让 ${activeModels.size} 个 AI 答题...`}
      </div>
    `;
    
    let res;
    try {
      const providers = Array.from(activeModels);
      res = await fetch(`${API}/api/ask`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-Device-ID': deviceId },
        body: JSON.stringify({ question, providers, images: uploadedImages }),
      });
    } catch(e) {
      document.getElementById('results').innerHTML = `<div class="error-card">❌ 网络错误：${e.message}</div>`;
      isLoading = false;
      document.getElementById('send').disabled = false;
      return;
    }
    
    let data;
    try {
      data = await res.json();
    } catch {
      const text = await res.text().catch(() => '');
      if (res.status === 413 || text.includes('413') || text.includes('Request Entity Too Large')) {
        document.getElementById('results').innerHTML = `<div class="error-card">❌ 图片太大了，请减少图片数量或压缩后重试</div>`;
      } else {
        document.getElementById('results').innerHTML = `<div class="error-card">❌ 服务器错误 (HTTP ${res.status})，请稍后重试</div>`;
      }
      isLoading = false;
      document.getElementById('send').disabled = false;
      return;
    }
    
    document.getElementById('results').innerHTML = '';
    
    if (res.status === 429) {
      document.getElementById('results').innerHTML = `<div class="error-card">⏰ ${data.message || '今日次数已用完'}</div>`;
      isLoading = false;
      document.getElementById('send').disabled = false;
      return;
    }
    
    if (data.error) {
      document.getElementById('results').innerHTML = `<div class="error-card">❌ ${data.error}</div>`;
      isLoading = false;
      document.getElementById('send').disabled = false;
      return;
    }
    
    if (data.comparison) {
      addComparison(data.comparison.summary, data.comparison.consensus);
    }
    
    if (data.answers && data.answers.length > 0) {
      data.answers.forEach(a => {
        const isBest = data.comparison?.bestAnswer?.provider === a.provider;
        const isVision = a.provider.toLowerCase().includes('vl') || a.provider.toLowerCase().includes('视觉');
        addResult(a.provider, a.answer, isBest, isVision);
      });
    } else {
      document.getElementById('results').innerHTML = `<div class="empty"><h2>😕 没有得到答案</h2><p>所有 AI 均未能解答此问题</p></div>`;
    }
    
    loadUsage();
    isLoading = false;
    document.getElementById('send').disabled = false;
  }

  document.getElementById('input').addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      askQuestion();
    }
  });

  loadUsage();
</script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js" defer></script>
</body>
</html>
